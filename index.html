<!doctype html>
<html lang="en">
  <head>
    <!-- CHARACTER ENCODING -->
    <meta charset="UTF-8" />

    <!-- RESPONSIVE VIEWPORT -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO TITLE -->
    <title>LAY CHALÉ | Thai, Chinese & Italian Restaurant</title>

    <!-- SEO DESCRIPTION -->
    <meta
      name="description"
      content="Discover Thai, Chinese and Italian cuisine at LAY CHALÉ. Enjoy botanical dining, private rooms, live music and special celebrations. Request your table today."
    />

    <!-- SEARCH ENGINE INDEXING -->
    <meta name="robots" content="index, follow" />

    <!-- BROWSER THEME -->
    <meta name="theme-color" content="#faf9f5" />

    <!-- FAVICON -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- OPEN GRAPH: FACEBOOK & LINE -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LAY CHALÉ" />

    <meta
      property="og:title"
      content="LAY CHALÉ | A Dining Experience"
    />

    <meta
      property="og:description"
      content="Good food. Great company. Beautiful moments. Experience Thai, Chinese and Italian cuisine at LAY CHALÉ."
    />

    <meta property="og:locale" content="en_US" />

    <!-- X / TWITTER CARD -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="LAY CHALÉ | A Dining Experience"
    />

    <meta
      name="twitter:description"
      content="Good food. Great company. Beautiful moments."
    />
  </head>

  <body>
    <!-- REACT ROOT -->
    <div id="root"></div>

    <!-- VITE ENTRY POINT -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
